<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusSentry | Student Safety Portal</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #090d16;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-red: #ef4444;
            --accent-red-glow: rgba(239, 68, 68, 0.35);
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(239, 68, 68, 0.05) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.25rem;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.25);
            color: var(--accent-green);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .nav-link:hover {
            color: var(--accent-blue);
        }

        .header-card {
            text-align: center;
        }

        .header-card h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-card p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1.25rem;
            padding: 1.25rem;
            backdrop-filter: blur(12px);
        }

        .user-pill {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.85rem;
        }

        .edit-btn {
            background: none;
            border: none;
            color: var(--accent-blue);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .form-full {
            grid-column: span 2;
        }

        .field-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.35rem;
            display: block;
        }

        input, select {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
            padding: 0.75rem 0.85rem;
            border-radius: 0.65rem;
            font-size: 0.85rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
        }

        .btn-secondary {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: white;
            padding: 0.75rem;
            border-radius: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.75rem;
        }

        .panic-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem 0;
        }

        .pulse-ring {
            position: absolute;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: var(--accent-red-glow);
            animation: ripple 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .panic-btn {
            position: relative;
            z-index: 2;
            width: 175px;
            height: 175px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 0 8px rgba(239, 68, 68, 0.15), 0 20px 35px -10px rgba(239, 68, 68, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 0.3rem;
        }

        .panic-btn:active {
            transform: scale(0.95);
        }

        .panic-btn .icon { font-size: 2rem; }
        .panic-btn .btn-text { font-size: 1rem; font-weight: 800; letter-spacing: 0.05em; }

        .toast {
            position: fixed;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 0.85rem 1.25rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            color: #fff;
            transition: bottom 0.3s ease;
            white-space: nowrap;
            z-index: 99;
        }

        .toast.visible { bottom: 2rem; }

        @keyframes ripple {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-nav">
            <div class="status-badge">
                <span class="status-dot"></span> Mesh Ready
            </div>
            <a href="/security.html" class="nav-link">Security Console &rarr;</a>
        </div>

        <div class="header-card">
            <h1>CampusSentry</h1>
            <p>Immediate Identity & WLAN Emergency Dispatch</p>
        </div>

        <!-- Student Profile Box -->
        <div class="card" id="profileView" style="display:none;">
            <div class="user-pill">
                <div>
                    <strong id="displayStudentName">Jane Doe</strong>
                    <div style="color: var(--text-secondary); font-size: 0.75rem;" id="displayStudentMeta">ID: 2024001 • 0712345678</div>
                </div>
                <button class="edit-btn" onclick="toggleEditProfile(true)">Edit</button>
            </div>
        </div>

        <!-- Student Registration Form -->
        <div class="card" id="profileFormCard">
            <div style="font-weight: 700; font-size: 0.95rem; margin-bottom: 0.85rem;">📝 Student Profile Registration</div>
            <form id="registrationForm" onsubmit="saveProfile(event)">
                <div class="form-grid">
                    <div class="form-full">
                        <label class="field-label">Student Number</label>
                        <input type="text" id="regStudentNumber" placeholder="e.g. 22003418" required />
                    </div>
                    <div>
                        <label class="field-label">First Name</label>
                        <input type="text" id="regFirstName" placeholder="e.g. John" required />
                    </div>
                    <div>
                        <label class="field-label">Surname</label>
                        <input type="text" id="regSurname" placeholder="e.g. Doe" required />
                    </div>
                    <div class="form-full">
                        <label class="field-label">Phone Number</label>
                        <input type="tel" id="regPhone" placeholder="e.g. 082 123 4567" required />
                    </div>
                </div>
                <button type="submit" class="btn-secondary">Save Identity Profile</button>
            </form>
        </div>

        <!-- Simulated WLAN Access Point Selector -->
        <div class="card">
            <label class="field-label">📍 Network AP Location</label>
            <select id="networkNode">
                <option value="ap-001-sci-floor2">Science Block — Floor 2 (AP-001)</option>
                <option value="ap-002-lib-basement">Central Library — Basement (AP-002)</option>
                <option value="ap-003-quad-north">North Quad — Pathway Alpha (AP-003)</option>
            </select>
        </div>

        <!-- Panic Button -->
        <div class="panic-wrapper">
            <div class="pulse-ring"></div>
            <button class="panic-btn" onclick="sendEmergencySignal()">
                <span class="icon">🚨</span>
                <span class="btn-text">PANIC</span>
            </button>
        </div>
    </div>

    <div id="toastNotification" class="toast">⚠️ Emergency Alert Broadcasted with Student Details!</div>

    <script>
        const socket = io();
        socket.emit('register-session', 'student-portal');

        let studentProfile = null;

        // Load profile from localStorage on startup
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('campussentry_student_profile');
            if (saved) {
                studentProfile = JSON.parse(saved);
                updateProfileUI();
            }
        });

        function saveProfile(e) {
            e.preventDefault();
            studentProfile = {
                studentNumber: document.getElementById('regStudentNumber').value.trim(),
                firstName: document.getElementById('regFirstName').value.trim(),
                surname: document.getElementById('regSurname').value.trim(),
                phone: document.getElementById('regPhone').value.trim()
            };
            localStorage.setItem('campussentry_student_profile', JSON.stringify(studentProfile));
            updateProfileUI();
        }

        function updateProfileUI() {
            if (!studentProfile) return;
            document.getElementById('displayStudentName').innerText = `${studentProfile.firstName} ${studentProfile.surname}`;
            document.getElementById('displayStudentMeta').innerText = `ID: ${studentProfile.studentNumber} • 📞 ${studentProfile.phone}`;
            document.getElementById('profileView').style.display = 'block';
            document.getElementById('profileFormCard').style.display = 'none';
        }

        function toggleEditProfile(showForm) {
            if (showForm && studentProfile) {
                document.getElementById('regStudentNumber').value = studentProfile.studentNumber;
                document.getElementById('regFirstName').value = studentProfile.firstName;
                document.getElementById('regSurname').value = studentProfile.surname;
                document.getElementById('regPhone').value = studentProfile.phone;
            }
            document.getElementById('profileFormCard').style.display = showForm ? 'block' : 'none';
            document.getElementById('profileView').style.display = showForm ? 'none' : 'block';
        }

        function sendEmergencySignal() {
            if (!studentProfile) {
                alert('Please fill in and save your Student Profile first before triggering an alert!');
                toggleEditProfile(true);
                return;
            }

            const selectedNetwork = document.getElementById('networkNode').value;

            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 200]);
            }

            const payload = {
                studentProfile: studentProfile,
                simulatedNetworkId: selectedNetwork,
                coords: { lat: 40.7128, lng: -74.0060 }
            };

            socket.emit('trigger-panic', payload);

            const toast = document.getElementById('toastNotification');
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 3500);
        }
    </script>
</body>
</html>
